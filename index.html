<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EmotionMusic</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🎵 <span>Emotion</span><b>Music</b>
        </div>

        <div class="nav-links">

            <a href="index.html" class="active">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="emotions.html">
                Emotions
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </nav>


    <!-- HOME CONTENT -->

    <main>

        <section class="hero">

            <h1>
                Emotion <span>Based</span> Songs
            </h1>

            <p>
                Feel the music that matches your emotion 🎵
            </p>


            <!-- SEARCH BOX -->

            <div class="search-box">

                <input
                    type="text"
                    id="emotionInput"
                    placeholder="Enter your emotion (e.g. happy, sad, love)"
                >

                <button
                    type="button"
                    id="musicButton">

                    Find My Music 🎧

                </button>

            </div>


            <!-- RESULT BOX -->

            <div class="result-box" id="resultBox">

                <div class="music-icon">
                    🎵
                </div>

                <h2>
                    Enter an emotion above
                </h2>

                <p>
                    We will find the perfect songs for you!
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        💜 “Music is what feelings sound like” 💜
    </footer>


    <!-- JAVASCRIPT -->

    <script>

        document
            .getElementById("musicButton")
            .addEventListener("click", function () {

                let emotion =
                    document
                    .getElementById("emotionInput")
                    .value
                    .trim()
                    .toLowerCase();


                let validEmotions = [
                    "happy",
                    "sad",
                    "love",
                    "angry",
                    "relaxed"
                ];


                if (emotion === "") {

                    alert("Please enter an emotion!");

                    return;
                }


                if (!validEmotions.includes(emotion)) {

                    alert(
                        "Please enter a valid emotion: Happy, Sad, Love, Angry, or Relaxed."
                    );

                    return;
                }


                let youtubeURL =
                    "https://www.youtube.com/results?search_query=" +
                    encodeURIComponent(emotion + " songs");


                window.location.href = youtubeURL;

            });

    </script>


    <script src="script.js"></script>

</body>

</html>
